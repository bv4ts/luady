version: 2
updates:
  # npm workspaces: the root lockfile covers every package under packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The code targets Node 22 (see .nvmrc), so its type definitions stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The integration and end-to-end tests are not a workspace: they have their own lockfile.
  - package-ecosystem: npm
    directory: /tests/integration
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      integration-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The website (site/) is not a workspace either: it has its own lockfile.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      site-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # No pip entry: the Python helper in server-kit uses only the standard library and has no
  # requirements file. Add one here, with its directory, when it gets a dependency.
