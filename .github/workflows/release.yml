name: Release

# Runs when a version tag such as v0.1.0 is pushed. The build job only has read access.
# The publish job, which has the write permissions, installs and runs nothing from the
# repository: it checks the files, attests them and creates the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::The tag '${TAG}' is not a version like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          version="${TAG#v}"
          declared="$(jq -r .version package.json)"
          if [ "${declared}" != "${version}" ]; then
            echo "::error::The tag is ${TAG} but package.json says ${declared}. Bump the version first, then tag that commit."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests of every workspace
        run: npm test

      - name: Licence check
        run: |
          npm run licence:check
          git diff --exit-code -- THIRD_PARTY_LICENSES.md

      - name: Pack the source and the built tree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="luady-${VERSION}"
          out="${RUNNER_TEMP}/release"
          stage="${RUNNER_TEMP}/stage/${name}"
          epoch="$(git log -1 --format=%ct)"
          mkdir -p "${out}" "${stage}/packages"

          # 1. The source: exactly the files of the tagged commit.
          git archive --format=tar --prefix="${name}-source/" HEAD | gzip -n > "${out}/${name}-source.tar.gz"

          # 2. The built tree: the built website and hub (and the other packages), with what they need to run.
          cp package.json package-lock.json LICENSE NOTICE THIRD_PARTY_LICENSES.md "${stage}/"
          cp -R licenses docs brain deploy server-kit "${stage}/"
          if [ -f README.md ]; then cp README.md "${stage}/"; fi
          find "${stage}/server-kit" -type d -name __pycache__ -prune -exec rm -rf {} +
          for dir in packages/*/; do
            pkg="$(basename "${dir}")"
            mkdir -p "${stage}/packages/${pkg}"
            cp "${dir}package.json" "${stage}/packages/${pkg}/package.json"
            if [ -d "${dir}dist" ]; then cp -R "${dir}dist" "${stage}/packages/${pkg}/dist"; fi
          done
          test -f "${stage}/packages/web/dist/index.html"
          test -f "${stage}/packages/hub/dist/main.js"
          printf 'version=%s\ncommit=%s\n' "${VERSION}" "${GITHUB_SHA}" > "${stage}/RELEASE"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -C "${RUNNER_TEMP}/stage" -cf - "${name}" | gzip -n > "${out}/${name}.tar.gz"

          # 3. The checksums of both files.
          (cd "${out}" && sha256sum "${name}.tar.gz" "${name}-source.tar.gz" > SHA256SUMS)
          cat "${out}/SHA256SUMS"

      - name: Keep the files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Check the checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          case "${VERSION}" in *-*) flags+=(--prerelease) ;; esac
          notes="Check the files before you use them: https://github.com/${GH_REPO}/blob/${TAG}/docs/verifying-releases.md"
          gh release create "${TAG}" \
            "release/luady-${VERSION}.tar.gz" \
            "release/luady-${VERSION}-source.tar.gz" \
            "release/SHA256SUMS" \
            --verify-tag \
            --title "Luady ${VERSION}" \
            --notes "${notes}" \
            --generate-notes \
            "${flags[@]}"
