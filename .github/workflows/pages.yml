# Builds the website (site/: the landing page and the docs from docs/, a Next.js static export) with the live web
# demo inside it, and publishes it to GitHub Pages:
#   https://<owner>.github.io/<repo>/        the landing page; /docs/ the docs
#   https://<owner>.github.io/<repo>/demo/   the office page against a pretend hub, in the browser
# One-time setup in the repository settings: Pages -> Build and deployment -> Source: GitHub Actions.
# Every action is pinned to a full commit SHA; the comment names its release tag.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website and the demo
    # Only the default branch is published, also when the workflow is started by hand on another branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Where the site is served: its base path, its absolute tags, and the folder the demo may talk to come from it.
      # The repository variable SITE_URL sets it; without one, the GitHub Pages address.
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install the site tools
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund

      # Builds the site twice into folders of its own and checks both; site/dist is not touched.
      - name: Test the site
        run: npm test --prefix site

      # The demo bundle needs no native module, so no install script runs.
      - name: Install the workspace
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Before the site, so the site's build finds it, links to it and copies it into demo/.
      - name: Build the web demo
        working-directory: packages/web
        run: npx --no-install vite build --config vite.demo.config.ts --base ./

      - name: Build the website with the demo
        run: npm run build --prefix site

      - name: Check every internal link, and that the demo is there
        run: npm run check:strict --prefix site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
