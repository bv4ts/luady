name: Idea or feature request
description: Suggest something new or an improvement.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Not sure it is ready for an issue? Start a thread in [Discussions](https://github.com/bv4ts/luady/discussions) first.

        **Security problem?** Do not use this form. Report it privately through the [security policy](https://github.com/bv4ts/luady/security/policy).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution. What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe what you would like Luady to do. A sketch or mock-up helps for anything visual.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including workarounds you use now.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Which part would it touch?
      options:
        - Hub
        - Website
        - Office engine
        - MCP server
        - Python helper on a server
        - Install scripts
        - Add-ons
        - Documentation
        - Not sure
    validations:
      required: false
  - type: dropdown
    id: install-kind
    attributes:
      label: How do you run Luady?
      options:
        - Demo or preview (no real server)
        - One machine
        - Several servers
        - I do not run it yet
    validations:
      required: false
  - type: dropdown
    id: help
    attributes:
      label: Could you help build it?
      options:
        - "No"
        - Maybe, with guidance
        - Yes, I would like to send a pull request
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and discussions and did not find this idea.
          required: true
        - label: I did not include secrets or personal data.
          required: true
