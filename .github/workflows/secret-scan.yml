name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Push runs are never cancelled:
# the scan covers only the commits of the push that triggered it, so cancelling
# one could leave commits unscanned. Each push gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # gitleaks is MIT licensed. Its release binary is downloaded and checked here
  # instead of using gitleaks/gitleaks-action, whose licence is not open source.
  # The checksum is the linux_x64 line of gitleaks_8.30.1_checksums.txt on the
  # v8.30.1 release (https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1).
  # To update: change both values together, from the new release's checksums file.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks, checksum verified
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      - name: Scan the commits of this push or pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # A new branch, or a force push that removed the old tip: scan all history up to this commit.
            range="${PUSH_AFTER}"
          fi
          echo "Scanning: ${range}"
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --no-banner --redact --verbose \
            --log-opts="${range}" --exit-code 1 .
